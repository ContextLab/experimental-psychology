<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 600" font-family="Avenir, Helvetica, sans-serif">
  <rect x="0" y="0" width="410" height="600" fill="#ffe1ad" stroke="#d94415" stroke-width="2"/>
  <text x="15" y="30" font-size="20" font-weight="700" fill="#d94415">Results</text>

  <!-- Row 1: multi-panel figure -->
  <rect x="20" y="45" width="120" height="100" fill="#ffa00f" stroke="#d94415" stroke-width="1.5"/>
  <text x="80" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Multi-panel</text>
  <text x="80" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">figure</text>
  <rect x="145" y="45" width="125" height="100" fill="#ffa00f" stroke="#d94415" stroke-width="1.5"/>
  <rect x="275" y="45" width="125" height="100" fill="#ffa00f" stroke="#d94415" stroke-width="1.5"/>
  <!-- Row 1 caption -->
  <rect x="20" y="155" width="380" height="40" fill="#ffa00f" stroke="#d94415" stroke-width="1.5"/>
  <text x="210" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Caption</text>

  <!-- Row 2: figure + caption side by side -->
  <rect x="20" y="215" width="180" height="115" fill="#ffa00f" stroke="#d94415" stroke-width="1.5"/>
  <text x="110" y="278" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Figure</text>
  <rect x="205" y="215" width="195" height="115" fill="#ffa00f" stroke="#d94415" stroke-width="1.5"/>
  <text x="302.5" y="278" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Caption</text>

  <!-- Row 3: multi-panel figure -->
  <rect x="20" y="350" width="120" height="110" fill="#ffa00f" stroke="#d94415" stroke-width="1.5"/>
  <text x="80" y="408" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Multi-panel</text>
  <text x="80" y="424" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">figure</text>
  <rect x="145" y="350" width="125" height="110" fill="#ffa00f" stroke="#d94415" stroke-width="1.5"/>
  <rect x="275" y="350" width="125" height="110" fill="#ffa00f" stroke="#d94415" stroke-width="1.5"/>
  <!-- Row 3 caption -->
  <rect x="20" y="470" width="380" height="40" fill="#ffa00f" stroke="#d94415" stroke-width="1.5"/>
  <text x="210" y="497" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Caption</text>

  <!-- Row 4: figure -->
  <rect x="20" y="520" width="380" height="65" fill="#ffa00f" stroke="#d94415" stroke-width="1.5"/>
  <text x="210" y="559" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Figure</text>
</svg>
