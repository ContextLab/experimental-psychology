<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" font-family="Avenir, Helvetica, sans-serif">
  <rect width="700" height="390" fill="none"/>

  <!-- Stats summary at top (single integrated line) -->
  <text x="350" y="22" text-anchor="middle" font-size="14" fill="#888">
    <tspan>n = </tspan><tspan font-weight="700" fill="#00693e">60</tspan><tspan>, </tspan><tspan>r = </tspan><tspan font-weight="700" fill="#00693e">0.78</tspan><tspan>, </tspan><tspan>mean score = </tspan><tspan font-weight="700" fill="#00693e">76.4</tspan><tspan>, </tspan><tspan>mean hours = </tspan><tspan font-weight="700" fill="#00693e">9.8</tspan>
  </text>

  <!-- Plot area: x from 100 to 660, y from 40 to 340 -->
  <!-- Axes -->
  <line x1="100" y1="340" x2="660" y2="340" stroke="#0a2518" stroke-width="2"/>
  <line x1="100" y1="40" x2="100" y2="340" stroke="#0a2518" stroke-width="2"/>

  <!-- X-axis ticks and labels -->
  <line x1="100" y1="340" x2="100" y2="346" stroke="#0a2518" stroke-width="2"/>
  <text x="100" y="362" text-anchor="middle" font-size="13" fill="#424141">0</text>
  <line x1="240" y1="340" x2="240" y2="346" stroke="#0a2518" stroke-width="2"/>
  <text x="240" y="362" text-anchor="middle" font-size="13" fill="#424141">5</text>
  <line x1="380" y1="340" x2="380" y2="346" stroke="#0a2518" stroke-width="2"/>
  <text x="380" y="362" text-anchor="middle" font-size="13" fill="#424141">10</text>
  <line x1="520" y1="340" x2="520" y2="346" stroke="#0a2518" stroke-width="2"/>
  <text x="520" y="362" text-anchor="middle" font-size="13" fill="#424141">15</text>
  <line x1="660" y1="340" x2="660" y2="346" stroke="#0a2518" stroke-width="2"/>
  <text x="660" y="362" text-anchor="middle" font-size="13" fill="#424141">20</text>

  <text x="380" y="385" text-anchor="middle" font-size="16" fill="#0a2518">Hours studied per week</text>

  <!-- Y-axis ticks and labels -->
  <line x1="94" y1="340" x2="100" y2="340" stroke="#0a2518" stroke-width="2"/>
  <text x="88" y="345" text-anchor="end" font-size="13" fill="#424141">40</text>
  <line x1="94" y1="280" x2="100" y2="280" stroke="#0a2518" stroke-width="2"/>
  <text x="88" y="285" text-anchor="end" font-size="13" fill="#424141">55</text>
  <line x1="94" y1="220" x2="100" y2="220" stroke="#0a2518" stroke-width="2"/>
  <text x="88" y="225" text-anchor="end" font-size="13" fill="#424141">70</text>
  <line x1="94" y1="160" x2="100" y2="160" stroke="#0a2518" stroke-width="2"/>
  <text x="88" y="165" text-anchor="end" font-size="13" fill="#424141">85</text>
  <line x1="94" y1="100" x2="100" y2="100" stroke="#0a2518" stroke-width="2"/>
  <text x="88" y="105" text-anchor="end" font-size="13" fill="#424141">100</text>

  <text x="40" y="190" text-anchor="middle" font-size="16" fill="#0a2518" transform="rotate(-90 40 190)">Exam score</text>

  <!-- Regression line: y = 50 + 2.4 * x; passes through (0, 50) and (20, 98)
       Plot coords: x=0 → 100, x=20 → 660; score=50 → y=300, score=98 → y=108 -->
  <line x1="100" y1="300" x2="660" y2="108" stroke="#00693e" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Data points (60 students), positive correlation with noise.
       Score-to-y mapping: y = 340 - (score - 40) * 5  (score 40-100 → y 340-40) -->
